<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopLite - Product Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="/">ShopLite</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="/cart">Cart</a></li>
          <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <a href="/products" class="text-decoration-none">← Back to products</a>
    <div class="row mt-3 g-4">
      <div class="col-12 col-md-6">
        <img id="product-img" class="img-fluid rounded border" alt="Product image">
      </div>
      <div class="col-12 col-md-6">
        <h1 class="h3" id="product-title"></h1>
        <p class="text-muted" id="product-desc"></p>
        <p class="h4" id="product-price"></p>
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-primary" data-add-to-cart>Add to cart</button>
          <a href="/cart" class="btn btn-outline-secondary">Go to cart</a>
        </div>
        <hr class="my-4">
        <h2 class="h5">Highlights</h2>
        <ul class="text-muted mb-0" id="product-highlights">
        </ul>
      </div>
    </div>
  </main>

  <footer class="py-4 border-top bg-white">
    <div class="container d-flex justify-content-between">
      <span class="text-muted">© <span data-year></span> ShopLite</span>
      <a href="/about" class="text-decoration-none">About</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/products-data.js"></script>
  <script>
    // Use the shared SHOP_PRODUCTS mapping if available
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || 'phone';
    const product = (window.SHOP_PRODUCTS && window.SHOP_PRODUCTS[id]) ? window.SHOP_PRODUCTS[id] : null;
    if (product) {
      // only set image src if not already set by server or another script
      const imgEl = document.getElementById('product-img');
      if (imgEl && (!imgEl.src || imgEl.src.endsWith('/'))) {
        imgEl.src = product.img;
      } else if (imgEl && imgEl.getAttribute('src') === null) {
        imgEl.src = product.img;
      }
      document.getElementById('product-title').textContent = product.title;
      document.getElementById('product-desc').textContent = product.desc;
      document.getElementById('product-price').textContent = product.priceDisplay || ('₹' + Number(product.price).toLocaleString());
      document.getElementById('product-highlights').innerHTML = (product.highlights || []).map(h => `<li>${h}</li>`).join('');
    }
  </script>
  <script src="/js/main.js"></script>
</body>
</html>
