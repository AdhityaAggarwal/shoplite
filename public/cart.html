<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopLite - Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="/">ShopLite</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
          <li class="nav-item"><a class="nav-link active" href="/cart">Cart</a></li>
          <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="h3 mb-4">Your Cart</h1>
    <div class="alert alert-info" id="cart-empty">Your cart is empty.</div>
    <div class="table-responsive d-none" id="cart-table-wrap">
      <table class="table align-middle" id="cart-table">
        <thead>
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Total</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
    <div class="d-flex justify-content-between mb-4">
      <a href="/products" class="btn btn-outline-secondary">Continue shopping</a>
      <a href="/checkout" class="btn btn-primary" id="checkout-btn">Checkout</a>
    </div>

    <div class="card p-4 d-none" id="order-summary-wrap">
      <h2 class="h5 mb-3">Order Summary</h2>
      <ul class="list-group list-group-flush">
        <li class="list-group-item d-flex justify-content-between align-items-center px-0">
          Subtotal
          <span id="cart-subtotal">₹0</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center px-0">
          Shipping
          <span id="cart-shipping">₹0</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center px-0">
          Tax (10%)
          <span id="cart-tax">₹0</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center px-0 fw-bold">
          Order Total
          <span id="cart-total">₹0</span>
        </li>
      </ul>
    </div>
  </main>

  <footer class="py-4 border-top bg-white">
    <div class="container d-flex justify-content-between">
      <span class="text-muted">© <span data-year></span> ShopLite</span>
      <a href="/about" class="text-decoration-none">About</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
